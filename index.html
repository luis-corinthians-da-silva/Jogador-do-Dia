<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jogador do Dia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1220;
      --text:#e8eefc;
      --muted:#a7b3d1;
      --accent:#7c5cff;
      --good:#2ee59d;
      --warn:#ffcc66;
      --danger:#ff5c7a;

      --shadow: 0 18px 50px rgba(0,0,0,.35);

      --side: 360px;
      --headerH: 76px;

      /* Card sizes (ajustado para não encostar em 4-3-3) */
      --cardW: 114px;
      --cardH: 124px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(124,92,255,.20), transparent 60%),
        radial-gradient(900px 700px at 80% 0%, rgba(46,229,157,.12), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden; /* desktop: página não rola */
    }
    @media (max-width: 1100px){
      body{ overflow:auto; }
    }

    header{
      height: var(--headerH);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(to bottom, rgba(255,255,255,.04), transparent);
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
    }

    .brand{display:flex; gap:12px; align-items:center; min-width:260px;}
    .logo{
      width:34px; height:34px; border-radius:10px;
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(46,229,157,.80));
      display:grid; place-items:center;
      color:#0b1220; font-weight:900;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      flex:0 0 auto;
      user-select:none;
    }
    .title{font-weight:850; letter-spacing:.2px; font-family:'Space Grotesk', 'Inter', ui-sans-serif, system-ui;}
    .panel-head h2, .infoTitle{ font-family:'Space Grotesk', 'Inter', ui-sans-serif, system-ui; }
    .subtitle{font-family:'Inter', ui-sans-serif, system-ui;}

    .subtitle{font-size:12px; color:var(--muted); margin-top:2px}

    .top-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.1px;
      display:flex; gap:8px; align-items:center;
      user-select:none;
    }
    .btn:hover{background: rgba(255,255,255,.10)}
    .btn:active{transform: translateY(1px)}

    .select{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      outline:none;
    }
    .select option{ background:#0c1526; color:var(--text); }
    .select:focus, .select:focus-visible{ outline:none; box-shadow:none; }

    .label{ font-size:12px; color:var(--muted); margin-right:6px; }

    
    .ratingWrap{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .ratingPill{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      padding:10px 12px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:fit-content;
      min-width:0;
    }
    .ratingNum{
      font-size:22px;
      font-weight:900;
      line-height:1;
      letter-spacing:.2px;
    }
/* Share menu */
    .menuWrap{ position:relative; }
    .menu{
      position:absolute;
      top:48px;
      right:0;
      width: 220px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(12,18,35,.92);
      border-radius:14px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:none;
      z-index:40;
      backdrop-filter: blur(10px);
    }
    .menu.open{ display:block; }
    .menu button{
      width:100%;
      border:0;
      background: transparent;
      color:var(--text);
      text-align:left;
      padding:12px 12px;
      cursor:pointer;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .menu button:hover{ background: rgba(255,255,255,.06); }
    .menu .sep{ height:1px; background: rgba(255,255,255,.10); }

    main{
      padding:16px 20px 18px;
      height: calc(100vh - var(--headerH));
      overflow:hidden; /* só os painéis rolam */
    }
    @media (max-width: 1100px){
      main{ height:auto; overflow:visible; }
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr var(--side) var(--side);
      gap:16px;
      align-items:stretch;
      height:100%;
      min-height:0;
    }
    @media (max-width: 1100px){
      .grid{grid-template-columns: 1fr; height:auto;}
    }

    /* Pitch */
    .pitch-wrap{
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:0; /* remove margens laterais vazias */
      height:100%;
      min-height:0;
      background: linear-gradient(180deg, rgba(255,255,255,.05), transparent);
      overflow:hidden;
    }

    .pitch{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      border-radius:18px;
      overflow:hidden;
      background: rgba(0,0,0,.12);
    }
    /* Escolha: cover para preencher 100% da área (sem “vazio” lateral). Pode cortar um pouco em cima/baixo. */
    .pitch-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.05) contrast(1.05);
      user-select:none;
      pointer-events:none;
    }
    .cards-layer{ position:absolute; inset:0; }

    @media (max-width: 1100px){
      .pitch{ height: 640px; }
      .pitch-wrap{ height:auto; }
    }

    /* FUT-like card */
    .card{
      position:absolute;
      width: var(--cardW);
      height: var(--cardH);
      transform: translate(-50%,-50%);
      border-radius:14px;
      cursor:grab;
      user-select:none;
      touch-action:none;
      box-shadow: 0 18px 28px rgba(0,0,0,.28);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.22);
      background: linear-gradient(180deg, rgba(240,223,167,1), rgba(208,177,120,1));
      font-family: 'Barlow Condensed', 'Inter', ui-sans-serif, system-ui;
    }
    .card:active{ cursor:grabbing; }
    .card *{ pointer-events:none; user-select:none; -webkit-user-drag:none; }

    .card.selected{
      box-shadow: 0 0 0 3px rgba(124,92,255,.65), 0 18px 28px rgba(0,0,0,.28);
      border-color: rgba(124,92,255,.75);
    }
    .card.mismatch{
      box-shadow: 0 0 0 3px rgba(255,204,102,.55), 0 18px 28px rgba(0,0,0,.28);
      border-color: rgba(255,204,102,.65);
    }
    .card.invalid{
      box-shadow: 0 0 0 3px rgba(255,92,122,.55), 0 18px 28px rgba(0,0,0,.28);
      border-color: rgba(255,92,122,.75);
    }

    .card-topbar{
      position:absolute;
      left:10px; right:10px;
      top:8px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      color: rgba(40,28,18,.98);
      text-shadow: 0 2px 10px rgba(255,255,255,.20);
      line-height:1;
    }
    .card-top-left{
      display:flex;
      align-items:flex-start;
      gap:6px;
      min-width:0;
    }
    .card-ovr{
      font-size:22px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .card-flag{
      font-size:14px;
      margin-top:3px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.18));
      opacity:.95;
    }
    .card-pos{
      font-size:14px;
      font-weight:500;
      letter-spacing:.6px;
      opacity:.95;
      text-transform:uppercase;
    }

    .card-photo{
      position:absolute;
      left:50%;
      top:34px;
      width: 90px;
      height: 66px;
      transform: translateX(-50%);
      border-radius:10px;
      overflow:hidden;
      background: transparent;
      border:0;
    }
    .card-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position: 50% 18%;
      display:block;
    }

    .card-name{
      position:absolute;
      left:8px; right:8px;
      bottom:4px;
      text-align:center;
      font-size:12px;
      font-weight:600;
      letter-spacing:.8px;
      color: rgba(40,28,18,.98);
      text-transform:uppercase;
      white-space:nowrap;
      overflow:visible;
      line-height:1.05;
    }

/* Panels */
    .panel{
      border:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius:18px;
      overflow:hidden;
      height:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .panel-head{
      padding:14px 14px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
    }
    .panel-head h2{ margin:0; font-size:14px; letter-spacing:.1px; }
    .infoHeadRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .infoHeadMeta{ display:flex; align-items:center; gap:8px; font-weight:900; }
    .infoHeadMeta .metaFlag{ font-size:18px; opacity:.95; }
    .infoHeadMeta .metaOvr{ font-size:16px; }


    .search{ margin-top:10px; display:flex; gap:8px; align-items:center; }
    .search input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text);
      outline:none;
      font-weight:700;
    }
    .search input::placeholder{ color: rgba(167,179,209,.85); }

    .active-state{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:10px;
      padding:10px 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      background: rgba(255,255,255,.04);
    }
    .active-dot{ width:10px;height:10px;border-radius:99px; background: rgba(255,255,255,.18); }
    .active-dot.on{ background: var(--good); box-shadow: 0 0 0 6px rgba(46,229,157,.12);}
    .active-meta{display:flex;flex-direction:column;gap:2px}
    .active-title{font-weight:900;font-size:13px}
    .active-sub{font-size:12px;color:var(--muted)}

    .panel-body{
      padding:8px 10px 12px;
      overflow:auto;
      min-height:0;
    }

    .group{
      margin-top:10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      overflow:hidden;
      background: rgba(255,255,255,.02);
    }
    .group h3{
      margin:0;
      padding:10px 10px;
      font-size:12px;
      letter-spacing:.2px;
      text-transform:uppercase;
      color: var(--muted);
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .count{font-size:11px; opacity:.9}

    .row{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 10px;
      border:0;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: transparent;
      cursor:pointer;
      color:inherit;
      text-align:left;
    }
    .row:last-child{border-bottom:0}
    .row:hover{background: rgba(255,255,255,.05)}

    .row-main{display:flex; align-items:center; gap:10px; min-width:0}
    .flag{font-size:16px; width:22px; text-align:center; opacity:.95}
    .row-name{
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .row-meta{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .ovr{
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.90);
      min-width:44px;
      text-align:center;
    }

    .row.out-lineup{opacity:.55}

    .row.candidate{
      outline: none;
      box-shadow: 0 0 0 3px rgba(124,92,255,.65);
      border-radius:12px;
      background: rgba(124,92,255,.10);
    }
    .row.mismatch .ovr{
      box-shadow: 0 0 0 3px rgba(255,204,102,.55);
      border-color: rgba(255,204,102,.60);
    }

    /* Info panel content */
    .infoBox{
      padding:14px 14px 16px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      border-radius:14px;
    }
    .infoTitle{ font-size:18px; font-weight:950; margin:0 0 10px; }
    .infoText{ color: rgba(167,179,209,.92); font-size:13px; line-height:1.35; }

    .playerHero{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius:16px;
      padding:12px;
    }
    .playerImg{
      width:100%;
      height: 360px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      margin-bottom:10px;
    }
    .playerImg img{ width:100%; height:100%; object-fit:cover; display:block; }
    .playerMetaRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .playerDay{ font-size:14px; font-weight:900; margin:10px 0 6px; text-align:center; }
    .playerDesc{ color: rgba(167,179,209,.92); font-size:13px; line-height:1.35; }

    .toast{
      position:fixed;
      left:20px;
      bottom:18px;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(10,16,29,.78);
      color: rgba(255,255,255,.90);
      backdrop-filter: blur(10px);
      max-width: 560px;
      display:none;
      box-shadow: var(--shadow);
      z-index:50;
    }
    .toast.show{display:block}
    .toast b{color:var(--text)}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">JD</div>
      <div>
        <div class="title">Jogador do Dia</div>
        <div class="subtitle">Monte sua escalação e compartilhe</div>
      </div>
    </div>

    <div class="top-actions">
      <div class="ratingWrap" aria-label="Rating do time">
        <span class="label">Rating</span>
        <div class="ratingPill"><span class="ratingNum" id="teamRating">—</span></div>
      </div>

      <span class="label">Formação</span>
      <select class="select" id="formationSelect" aria-label="Selecionar formação"></select>

      <div class="menuWrap">
        <button class="btn" id="shareBtn" aria-haspopup="menu" aria-expanded="false" title="Compartilhar">
          ⤴ Compartilhar
        </button>
        <div class="menu" id="shareMenu" role="menu" aria-label="Menu de compartilhamento">
          <button id="downloadBtn" role="menuitem">
            <span>Baixar escalação</span><span>⬇</span>
          </button>
          <div class="sep"></div>
          <button id="nativeShareBtn" role="menuitem">
            <span>Compartilhar…</span><span>↗</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="pitch-wrap" aria-label="Campo interativo">
        <div class="pitch" id="pitch">
          <img class="pitch-img" src="./assets/field2.jpg" alt="" aria-hidden="true" />
          <div class="cards-layer" id="cardsLayer"></div>
        </div>
      </section>

      <aside class="panel" aria-label="Lista lateral de jogadores para substituição">
        <div class="panel-head">
          <h2>Elenco</h2>

          <div class="search">
            <input id="searchInput" type="search" placeholder="Buscar jogador (nome)..." />
          </div>

          <div class="active-state">
            <div class="active-dot" id="activeDot"></div>
            <div class="active-meta">
              <div class="active-title" id="activeTitle">Nenhuma substituição armada</div>
              <div class="active-sub" id="activeSub">Clique no campo ou no elenco para começar</div>
            </div>
          </div>
        </div>

        <div class="panel-body" id="panelBody"></div>
      </aside>

      <aside class="panel" aria-label="Painel informativo do projeto / jogador">
        <div class="panel-head">
          <div class="infoHeadRow">
            <h2 id="infoHead">Jogador do Dia</h2>
            <div class="infoHeadMeta" id="infoHeadMeta" aria-hidden="true"></div>
          </div>
        </div>
        <div class="panel-body" id="infoBody"></div>
      </aside>
    </div>
  </main>

    async function loadPlayersData(){
      try{
        const res = await fetch("./players.json", { cache: "no-store" });
        if(!res.ok) throw new Error("fetch failed");
        return await res.json();

        return JSON.parse(document.getElementById("playersSeed").textContent);
      }

    function isoToFlagEmoji(iso2){
      if(!iso2 || iso2.length!==2) return "🏳️";
      const A = 0x1F1E6;
      const codePoints = [...iso2.toUpperCase()].map(c => A + (c.charCodeAt(0) - 65));
      return String.fromCodePoint(...codePoints);
    }

    function hash(str){
      let h=0;
      for(let i=0;i<str.length;i++) h = Math.imul(31,h) + str.charCodeAt(i) | 0;
      return h;
    }
    function escapeXML(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
    function avatarDataURI(name){
      const hue = (hash(name) % 360 + 360) % 360;
      const initials = String(name).split(" ").filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join("");
      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="hsl(${hue},85%,58%)"/>
            <stop offset="1" stop-color="hsl(${(hue+35)%360},85%,55%)"/>
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="64" fill="url(#g)"/>
        <circle cx="64" cy="64" r="62" fill="rgba(0,0,0,.12)"/>
        <text x="64" y="74" text-anchor="middle"
              font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial"
              font-size="44" font-weight="800" fill="rgba(255,255,255,.92)">${escapeXML(initials)}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    function getPlayer(pid){ return players.find(p=>p.id===pid); }
    function isInLineup(pid){ return Object.values(lineup).includes(pid); }

    function inferPositionLabel(nx, ny){
      const x = Math.max(0, Math.min(1, nx));
      const y = Math.max(0, Math.min(1, ny));
      const side = x < 0.33 ? "L" : (x > 0.67 ? "R" : "C");

      if(y > 0.83) return "GK";
      if(y > 0.68){
        if(side === "L") return "LB";
        if(side === "R") return "RB";
        return "CB";
      }
      if(y > 0.56){
        if(side === "L") return "LCM";
        if(side === "R") return "RCM";
        return "CM";
      }
      if(y > 0.40){
        if(side === "L") return "LM";
        if(side === "R") return "RM";
        return "CAM";
      }
      if(y > 0.26){
        if(side === "L") return "LW";
        if(side === "R") return "RW";
        return "CF";
      }
      return "ST";
    }

    function expectedGroupForLabel(label){
      const L = String(label || "").toUpperCase();
      if(L === "GK") return "Goleiro";
      if(L.includes("CB")) return "Zagueiro";
      if(L.includes("LB") || L.includes("RB") || L.includes("WB")) return "Lateral";
      if(L.includes("DM") || L.includes("CM") || L.includes("AM") || L.includes("LM") || L.includes("RM") || L.includes("CAM") || L.includes("CDM")) return "Meia";
      if(L.includes("ST") || L.includes("CF") || L.includes("LW") || L.includes("RW") || L.includes("LF") || L.includes("RF")) return "Atacante";
      return null;
    }

    function mismatchSeverity(slotId){
      const s = slots.find(x=>x.id===slotId);
      if(!s) return "none";
      const p = getPlayer(lineup[slotId]);
      if(!p) return "none";
      const expected = expectedGroupForLabel(s.label);
      if(!expected) return "none";
      if(p.primary_group === expected) return "none";
      if(p.primary_group === "Goleiro" || expected === "Goleiro") return "danger";
      return "warn";
    }

    function pickBest(group, usedSet){
      const list = players
        .filter(p=>p.primary_group===group && !usedSet.has(p.id))
        .sort((a,b)=>b.peak_overall - a.peak_overall);
      return list[0]?.id ?? null;
    }

    function buildLineupForFormation(formationKey){
      const used = new Set();
      const mapping = {};
      const fslots = formations[formationKey] || formations[lastNonFreeKey];
      for(const s of fslots){
        const expected = expectedGroupForLabel(s.label);
        let pid = null;
        if(expected) pid = pickBest(expected, used);
        if(!pid) pid = players.find(p=>!used.has(p.id))?.id ?? null;
        if(pid){
          used.add(pid);
          mapping[s.id] = pid;
        }
      }
      return mapping;
    }

    function setFormationOptions(){
      formationSelect.innerHTML = "";
      formationCatalog.forEach(item => {

      formationSelect.value = currentFormationKey;

    function applyFormation(key, {resetLineup=false} = {}){
      if(key === "free"){
        currentFormationKey = "free";
        formationSelect.value = "free";
        selectedSlotId = null;
        selectedCandidateId = null;
        renderAll();
        showToast("Formação: <b>Livre</b>");
        return;
      }

      currentFormationKey = key;
      lastNonFreeKey = key;

      slots = structuredClone(formations[key]);

      if(resetLineup){
        lineup = buildLineupForFormation(key);
      }else{
        const next = {};
        for(const s of slots) next[s.id] = lineup[s.id] ?? null;

        const used = new Set(Object.values(next).filter(Boolean));
        for(const s of slots){
          if(!next[s.id]){
            const expected = expectedGroupForLabel(s.label);
            let pid = expected ? pickBest(expected, used) : null;
            if(!pid) pid = players.find(p=>!used.has(p.id))?.id ?? null;
            if(pid){ used.add(pid); next[s.id]=pid; }
          }
        }
        lineup = next;
      }

      selectedSlotId = null;
      selectedCandidateId = null;
      formationSelect.value = key;

      renderAll();
      showToast(`Formação: <b>${formationCatalog.find(x=>x.key===key)?.label || key}</b>`);
    }

    function renderPitch(){
      cardsLayer.innerHTML = "";
      const pitchRect = pitchEl.getBoundingClientRect();

      slots.forEach(s => {
        const pid = lineup[s.id];
        const p = getPlayer(pid);
        if(!p) return;

        const sev = mismatchSeverity(s.id);
        const el = document.createElement("div");
        el.className = "card" +
          (selectedSlotId===s.id ? " selected" : "") +
          (sev === "warn" ? " mismatch" : "") +
          (sev === "danger" ? " invalid" : "");
        el.dataset.slotId = s.id;

        const x = (s.xPct/100) * pitchRect.width;
        const y = (s.yPct/100) * pitchRect.height;

        el.style.left = x + "px";
        el.style.top = y + "px";

        const flag = p.flag_emoji || isoToFlagEmoji(p.nationality_iso2 || p.nationality_code);
        const photo = p.photo_url || avatarDataURI(p.display_name || p.full_name || "JD");

        el.innerHTML = `
          <div class="card-topbar">

            </div>

          </div>

            <img src="${photo}" alt="${p.display_name}" draggable="false" />
          </div>
          <div class="card-name">${(p.display_name || "").toUpperCase()}</div>
        `;

        cardsLayer.appendChild(el);
        attachDrag(el);

        el.addEventListener("click", () => {
          if(el.dataset.justDragged === "1"){ el.dataset.justDragged = "0"; return; }

          // Fluxo: selecionou alguém do elenco e quer substituir no campo
          if(selectedCandidateId){
            substitute(s.id, selectedCandidateId);
            selectedCandidateId = null;
            selectedSlotId = null;
            renderAll();
            return;
          }

          // Swap direto: clique A (campo) + clique B (campo)
          if(selectedSlotId && selectedSlotId !== s.id){
            const a = selectedSlotId;
            const b = s.id;
            const pidA = lineup[a];
            const pidB = lineup[b];
            lineup[a] = pidB;
            lineup[b] = pidA;
            selectedSlotId = null;
            renderAll();
            showToast(`Troca: <b>${getPlayer(pidB).display_name}</b> ↔ <b>${getPlayer(pidA).display_name}</b>`);
            return;
          }

          // Toggle seleção
          if(selectedSlotId === s.id){
            selectedSlotId = null;
            renderAll();
            showToast("Seleção do campo removida.");
          } else {
            selectedSlotId = s.id;
            renderAll();
            const sp = getPlayer(lineup[s.id]);
            showToast(`Escolha outro jogador para trocar: <b>${sp.display_name}</b>.`);
          }
        });
      });
    }

    function attachDrag(el){
      let dragging=false;
      let startX=0, startY=0, startLeft=0, startTop=0;
      let moved=0;

      const onDown = (e)=>{
        if(e.button !== undefined && e.button !== 0) return;
        dragging=true;
        moved=0;
        el.setPointerCapture(e.pointerId);

        const rect = el.getBoundingClientRect();
        const pitchRect = pitchEl.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left - pitchRect.left + rect.width/2;
        startTop = rect.top - pitchRect.top + rect.height/2;
      };

      const onMove = (e)=>{
        if(!dragging) return;
        const pitchRect = pitchEl.getBoundingClientRect();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));

        let nx = startLeft + dx;
        let ny = startTop + dy;

        const pad = 18;
        nx = Math.max(pad, Math.min(pitchRect.width - pad, nx));
        ny = Math.max(pad, Math.min(pitchRect.height - pad, ny));

        el.style.left = nx + "px";
        el.style.top = ny + "px";
      };

      const onUp = (e)=>{
        if(!dragging) return;
        dragging=false;
        el.releasePointerCapture(e.pointerId);

        if(moved > 8){
          el.dataset.justDragged = "1";
          const pitchRect = pitchEl.getBoundingClientRect();
          const left = parseFloat(el.style.left);
          const top = parseFloat(el.style.top);
          const slotId = el.dataset.slotId;
          const s = slots.find(x=>x.id===slotId);
          if(!s) return;

          s.xPct = (left / pitchRect.width) * 100;
          s.yPct = (top / pitchRect.height) * 100;

          const nx = left / pitchRect.width;
          const ny = top / pitchRect.height;
          s.label = inferPositionLabel(nx, ny);

          renderAll();
        }
      };

      el.addEventListener("pointerdown", onDown);
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointercancel", onUp);
    }

    function substitute(slotId, newPlayerId){
      const currentPlayerId = lineup[slotId];
      if(currentPlayerId === newPlayerId){
        showToast("Esse jogador já está nessa posição.");
        return;
      }

      const otherSlotId = Object.entries(lineup).find(([sid,pid])=>pid===newPlayerId)?.[0] ?? null;

      if(otherSlotId){
        lineup[otherSlotId] = currentPlayerId;
        lineup[slotId] = newPlayerId;
        showToast(`Troca: <b>${getPlayer(newPlayerId).display_name}</b> ↔ <b>${getPlayer(currentPlayerId).display_name}</b>`);
      } else {
        lineup[slotId] = newPlayerId;
        showToast(`Entrou: <b>${getPlayer(newPlayerId).display_name}</b>`);
      }

      const sev = mismatchSeverity(slotId);
      if(sev !== "none"){
        const pos = slots.find(s=>s.id===slotId)?.label ?? "—";
        showToast(`⚠️ <b>${getPlayer(newPlayerId).display_name}</b> ficou fora da posição esperada (${pos}).`);
      }
    }

    function calculateTeamRating(){
      const vals = Object.values(lineup).map(pid => getPlayer(pid)?.peak_overall || 0).filter(Boolean);
      if(!vals.length) return 0;
      const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
      const max = Math.max(...vals);
      return Math.round(avg + (max - avg) * 0.30);
    }

        if(navigator.share){
          await navigator.share(shareData);
          showToast("Compartilhado.");
        } else {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Link copiado.");
        }
      }catch(err){
        console.error(err);
        showToast("Não foi possível compartilhar.");
      }
    });

    function renderAll(){
      renderPitch();
      renderPanel();
      renderInfoPanel();
      const rating = calculateTeamRating();
      teamRatingEl.textContent = rating ? String(rating) : "—";
    }

    formationSelect.addEventListener("change", (e)=>{
      applyFormation(e.target.value, {resetLineup:false});
    });

    searchInput.addEventListener("input", ()=>{ renderPanel(); });

    window.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){
        if(selectedSlotId || selectedCandidateId){
          selectedSlotId = null;
          selectedCandidateId = null;
          showToast("Seleções limpas.");
          renderAll();
        }
      }
    });

    window.addEventListener("resize", ()=>{ renderPitch(); });

    (async function init(){
      const data = await loadPlayersData();
      const list = (data.players || data) || [];
      players = list.map(p => ({
        ...p,
        peak_overall: Number(p.peak_overall || 0),
        top_positions: p.top_positions || [],
        flag_emoji: p.flag_emoji || null,
        photo_url: p.photo_url || avatarDataURI(p.display_name || p.full_name || "JD"),
      }));

      const fixes = new Set(["błaszczykowski","boa morte","eduardo"]);
      players = players.map(p => fixes.has(String(p.display_name||"").toLowerCase()) ? ({...p, primary_group:"Meia"}) : p);

      setFormationOptions();
      slots = structuredClone(formations[currentFormationKey]);
      lineup = buildLineupForFormation(currentFormationKey);
      formationSelect.value = currentFormationKey;
      renderAll();

      showToast(`Carregado: <b>${players.length}</b> jogadores.`);
    })();
  </script>
</body>
</html>
